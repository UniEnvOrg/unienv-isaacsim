[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unienv_isaaclab"
version = "0.0.1"
description = "Isaac Lab adaptor for UniEnv's World / WorldNode / WorldEnv"
requires-python = ">=3.10"
# Isaac Lab (isaaclab) is expected in the environment; it is not pip-resolvable here.
dependencies = ["unienv", "torch"]

[tool.setuptools.packages.find]
include = ["unienv_isaaclab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
