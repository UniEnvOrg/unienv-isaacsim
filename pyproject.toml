[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unienv_isaacsim"
version = "0.0.1"
description = "Isaac Lab adaptor for UniEnv's World / WorldNode / WorldEnv"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Isaac Lab (isaaclab) is expected in the environment; it is not pip-resolvable here.
dependencies = ["unienv", "torch"]

[tool.setuptools.packages.find]
include = ["unienv_isaacsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
